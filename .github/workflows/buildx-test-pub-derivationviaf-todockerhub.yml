name: "buildx-test-pub-derivationviaf-todockerhub"

env:
  DOCKERHUB_IMAGE_PREFIX: abesesr/idref

on:
  push:
    paths:
      - 'derivation-viaf/**'
  pull_request:
  workflow_dispatch:

jobs:
  # Derivation-Viaf job
  buildx-test-pubtodockerhub:
    name: Build Derivation-Viaf
    runs-on: ubuntu-latest
    steps:
      - name: "Build: checkout source code"
        uses: actions/checkout@v6

      - name: "Push: prepare version from git tags/branchs"
        id: docker_tag_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE_PREFIX }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Login to DockerHub"
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Buildx and push"
        uses: docker/build-push-action@v7
        with:
          context: ./derivation-viaf
          file: ./derivation-viaf/Dockerfile
          push: ${{ github.event_name != 'pull_request'}}
          target: derivation-viaf-server
          tags: ${{ steps.docker_tag_meta.outputs.tags }}-derivation-viaf